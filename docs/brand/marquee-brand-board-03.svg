          <use href="#bulb" x="316" y="314"/>
          <use href="#bulb" x="372" y="314"/>
          <use href="#bulb" x="428" y="314"/>
          <use href="#bulb" x="484" y="314"/>
          <use href="#bulb" x="540" y="314"/>
          <use href="#bulb" x="596" y="314"/>
          <use href="#bulb" x="652" y="314"/>
          <use href="#bulb" x="708" y="314"/>
          <use href="#bulb" x="764" y="314"/>
          <use href="#bulb" x="820" y="314"/>

