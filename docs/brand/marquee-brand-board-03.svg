          <use href="#bulb" x="316" y="676"/>
          <use href="#bulb" x="372" y="676"/>
          <use href="#bulb" x="428" y="676"/>
          <use href="#bulb" x="484" y="676"/>
          <use href="#bulb" x="540" y="676"/>
          <use href="#bulb" x="596" y="676"/>
          <use href="#bulb" x="652" y="676"/>
          <use href="#bulb" x="708" y="676"/>
          <use href="#bulb" x="764" y="676"/>
