<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="boardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101419"/>
      <stop offset="0.52" stop-color="#0B0E12"/>
      <stop offset="1" stop-color="#07090C"/>
    </linearGradient>

    <radialGradient id="boardGlow" cx="24%" cy="34%" r="62%">
      <stop offset="0" stop-color="#23527D" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#173652" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0A0C0F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="iconBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252E38"/>
      <stop offset="0.46" stop-color="#13181E"/>
      <stop offset="1" stop-color="#080A0D"/>
    </linearGradient>

    <linearGradient id="iconRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3CED9" stop-opacity="0.58"/>
      <stop offset="0.36" stop-color="#667483" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#222A33" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="iconGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="iconSpot" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#4B9BE4" stop-opacity="0.28"/>
      <stop offset="0.52" stop-color="#2D6B9E" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0A0D11" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>

    <linearGradient id="signFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B333D"/>
      <stop offset="0.48" stop-color="#171D24"/>
      <stop offset="1" stop-color="#0C1015"/>
    </linearGradient>

    <linearGradient id="signPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#05070A"/>
    </linearGradient>

    <linearGradient id="letterFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5FBFF"/>
      <stop offset="0.34" stop-color="#B8E0FF"/>
      <stop offset="0.72" stop-color="#6AB7FF"/>
      <stop offset="1" stop-color="#2F7DCB"/>
    </linearGradient>

    <radialGradient id="bulbHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFEFC0" stop-opacity="0.68"/>
      <stop offset="0.3" stop-color="#FFD57A" stop-opacity="0.28"/>
      <stop offset="0.68" stop-color="#FFC95A" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFC95A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="mGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58A9FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#58A9FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="posterSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08131F"/>
      <stop offset="0.58" stop-color="#153347"/>
      <stop offset="0.86" stop-color="#2E5569"/>
      <stop offset="1" stop-color="#8B6548"/>
    </linearGradient>

    <radialGradient id="posterSun" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#FFF7DD"/>
      <stop offset="0.58" stop-color="#F4DDA7"/>
      <stop offset="1" stop-color="#D9A45D"/>
    </radialGradient>

    <radialGradient id="posterSunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7DCA4" stop-opacity="0.34"/>
      <stop offset="0.46" stop-color="#E9B96D" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#E9B96D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="spotlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9DEFF" stop-opacity="0.20"/>
      <stop offset="0.52" stop-color="#7BBCFF" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#7BBCFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="iconClip">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>

    <clipPath id="posterArtClip">
      <rect x="371" y="324" width="282" height="322"/>
    </clipPath>

    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.62"/>
    </filter>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="letterBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <filter id="posterShadow" x="-40%" y="-30%" width="180%" height="170%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <g id="bulb">
      <circle r="15" fill="url(#bulbHalo)"/>
      <circle r="7" fill="#FFF0C6"/>
      <circle cx="-2.2" cy="-2.2" r="2.5" fill="#FFFFFF"/>
    </g>

    <symbol id="appIcon" viewBox="0 0 1024 1024">
      <g clip-path="url(#iconClip)">
        <rect width="1024" height="1024" fill="url(#iconBg)"/>
        <rect width="1024" height="540" fill="url(#iconGloss)"/>
        <ellipse cx="512" cy="480" rx="420" ry="350" fill="url(#iconSpot)"/>
        <rect y="720" width="1024" height="304" fill="url(#bottomShade)"/>

        <rect x="200" y="304" width="624" height="460" rx="52" fill="#000000" opacity="0.72" filter="url(#softBlur)"/>

        <g>
          <rect x="192" y="280" width="640" height="460" rx="52" fill="url(#signFrame)" stroke="#586575" stroke-width="3"/>
          <path d="M232 288 H792" stroke="#D7E2ED" stroke-opacity="0.20" stroke-width="2" stroke-linecap="round"/>
          <rect x="218" y="306" width="588" height="408" rx="32" fill="url(#signPanel)" stroke="#2C3641" stroke-width="2"/>
          <rect x="224" y="312" width="576" height="396" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>

          <use href="#bulb" x="232" y="294"/>
          <use href="#bulb" x="288" y="294"/>
          <use href="#bulb" x="344" y="294"/>
          <use href="#bulb" x="400" y="294"/>
          <use href="#bulb" x="456" y="294"/>
          <use href="#bulb" x="512" y="294"/>
          <use href="#bulb" x="568" y="294"/>
          <use href="#bulb" x="624" y="294"/>
          <use href="#bulb" x="680" y="294"/>
          <use href="#bulb" x="736" y="294"/>
          <use href="#bulb" x="792" y="294"/>

          <use href="#bulb" x="232" y="726"/>
          <use href="#bulb" x="288" y="726"/>
          <use href="#bulb" x="344" y="726"/>
          <use href="#bulb" x="400" y="726"/>
          <use href="#bulb" x="456" y="726"/>
          <use href="#bulb" x="512" y="726"/>
          <use href="#bulb" x="568" y="726"/>
          <use href="#bulb" x="624" y="726"/>
          <use href="#bulb" x="680" y="726"/>
          <use href="#bulb" x="736" y="726"/>
          <use href="#bulb" x="792" y="726"/>

          <use href="#bulb" x="206" y="370"/>
          <use href="#bulb" x="206" y="500"/>
          <use href="#bulb" x="206" y="630"/>
          <use href="#bulb" x="818" y="370"/>
          <use href="#bulb" x="818" y="500"/>
          <use href="#bulb" x="818" y="630"/>
        </g>

        <polygon points="512,310 300,705 724,705" fill="url(#spotlight)"/>
        <ellipse cx="512" cy="500" rx="190" ry="200" fill="url(#mGlow)"/>

        <rect x="362" y="315" width="300" height="390" rx="5" fill="#000000" opacity="0.62" filter="url(#posterShadow)"/>
        <rect x="362" y="315" width="300" height="390" rx="5" fill="#E8D9BA" stroke="#FFF1D2" stroke-opacity="0.55" stroke-width="1.2"/>

        <g clip-path="url(#posterArtClip)">
          <rect x="371" y="324" width="282" height="322" fill="url(#posterSky)"/>
          <circle cx="512" cy="455" r="100" fill="url(#posterSunGlow)"/>
          <circle cx="512" cy="455" r="70" fill="url(#posterSun)"/>
          <circle cx="500" cy="443" r="60" fill="#FFF6DB" opacity="0.16"/>

          <g fill="#F6E8C8" opacity="0.85">
            <circle cx="430" cy="380" r="2.0"/>
            <circle cx="580" cy="362" r="1.5"/>
            <circle cx="612" cy="410" r="1.8"/>
            <circle cx="430" cy="425" r="1.4"/>
            <circle cx="470" cy="352" r="1.1"/>
            <circle cx="585" cy="388" r="1.2"/>
          </g>

          <path d="M371 590 L420 542 L458 574 L504 514 L548 560 L586 530 L604 552 L604 646 L371 646 Z" fill="#07111B"/>
          <path d="M371 610 L420 584 L466 602 L512 574 L560 596 L604 580 L604 646 L371 646 Z" fill="#03070C"/>
          <path d="M371 620 H604" stroke="#D7B57A" stroke-opacity="0.45" stroke-width="1.6"/>
          <path d="M508 596 c-2.2 0 -4 1.8 -4 4 c0 1.7 .9 3.2 2.4 3.8 l-1.5 16 h3 v-8.5 h2 v8.5 h3 l-1.5 -16 c1.5 -.6 2.4 -2.1 2.4 -3.8 c0 -2.2 -1.8 -4 -4 -4 z" fill="#03070C"/>
        </g>
        <rect x="371" y="324" width="282" height="322" fill="none" stroke="#000000" stroke-opacity="0.20" stroke-width="1"/>
        <rect x="371" y="646" width="282" height="1" fill="#C9B58D" opacity="0.6"/>

        <rect x="390" y="660" width="160" height="7" rx="3.5" fill="#16283C"/>
        <rect x="390" y="674" width="100" height="4" rx="2" fill="#5C7188"/>
        <circle cx="630" cy="662" r="5" fill="#63B3FF"/>
      </g>

      <rect x="6" y="6" width="1012" height="1012" rx="214" fill="none" stroke="url(#iconRim)" stroke-width="3"/>
      <rect x="16" y="16" width="992" height="992" rx="205" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2"/>
