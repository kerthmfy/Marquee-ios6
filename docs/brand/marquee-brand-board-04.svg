  <text x="664" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="600" letter-spacing="7" fill="#67B7FF">WHAT TO WATCH NEXT</text>

  <line x1="664" y1="514" x2="1436" y2="514" stroke="#242C35" stroke-width="1"/>

  <text x="664" y="553" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="400" fill="#909CAA">Recommendations, watchlist, and history for</text>
  <text x="664" y="585" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="400" fill="#909CAA">movies, TV, and anime.</text>

  <text x="100" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11" font-weight="600" letter-spacing="4" fill="#5D6A78">PALETTE</text>

  <g>
    <rect x="100" y="730" width="58" height="58" rx="12" fill="#0B0E12" stroke="#2B3540"/>
    <rect x="174" y="730" width="58" height="58" rx="12" fill="#1B222B" stroke="#2B3540"/>
    <rect x="248" y="730" width="58" height="58" rx="12" fill="#8E9CAB" stroke="#2B3540"/>
    <rect x="322" y="730" width="58" height="58" rx="12" fill="#63B3FF" stroke="#2B3540"/>
    <rect x="396" y="730" width="58" height="58" rx="12" fill="#FFE8B0" stroke="#2B3540"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" letter-spacing="1.4" fill="#5D6A78">
    <text x="129" y="812" text-anchor="middle">OBSIDIAN</text>
    <text x="203" y="812" text-anchor="middle">CHARCOAL</text>
    <text x="277" y="812" text-anchor="middle">SILVER</text>
    <text x="351" y="812" text-anchor="middle">MARQUEE</text>
    <text x="425" y="812" text-anchor="middle">BULB</text>
  </g>

  <text x="1050" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11" font-weight="600" letter-spacing="4" fill="#5D6A78">ICON AT SIZE</text>

  <use href="#appIcon" x="1050" y="730" width="114" height="114"/>
  <use href="#appIcon" x="1190" y="787" width="57" height="57"/>
  <use href="#appIcon" x="1280" y="815" width="29" height="29"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="1" fill="#4F5C69" text-anchor="middle">
    <text x="1107" y="870">114 PX</text>
    <text x="1218.5" y="870">57 PX</text>
    <text x="1294.5" y="870">29 PX</text>
  </g>

  <line x1="100" y1="930" x2="1500" y2="930" stroke="#1D242C" stroke-width="1"/>
  <text x="100" y="960" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="9.5" font-weight="500" letter-spacing="2.4" fill="#46525F">LIT MARQUEE / POSTER CASE</text>
  <text x="1500" y="960" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="9.5" font-weight="500" letter-spacing="2.4" fill="#46525F">VECTOR DRAFT / READY FOR REVISION</text>
