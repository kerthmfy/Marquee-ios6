  <rect width="1600" height="1000" fill="url(#boardBg)"/>
  <rect width="1600" height="1000" fill="url(#boardGlow)"/>

  <text x="100" y="78" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
